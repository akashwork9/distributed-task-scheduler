services:
  # DTS Backend API & Distributed Worker Engine
  - type: web
    name: distributed-task-scheduler-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL
        value: "true"
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://distributed-task-scheduler.vercel.app,http://localhost:3000,http://localhost:5173"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: WORKER_ENABLED
        value: "true"
