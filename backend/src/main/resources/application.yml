server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: distributed-task-scheduler
  profiles:
    active: dev

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/dts_db}
    username: ${DATABASE_USERNAME:dts_user}
    password: ${DATABASE_PASSWORD:dts_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: dts-worker-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# Application Custom Properties
dts:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    poll-interval-ms: 5000
    batch-size: 50
    lock-name: "lock:scheduler:poll"
    lock-lease-time-ms: 10000
    lock-wait-time-ms: 2000
  worker:
    enabled: ${WORKER_ENABLED:true}
    id: ${WORKER_ID:worker-node-1}
    capacity: 10
    heartbeat-interval-ms: 10000
    zombie-threshold-seconds: 60
  kafka:
    topics:
      task-requested: "task.execution.requested"
      task-completed: "task.execution.completed"
      task-failed: "task.execution.failed"
      task-retry: "task.execution.retry"
      task-dlq: "task.execution.dlq"
  rate-limit:
    requests-per-minute: 120
